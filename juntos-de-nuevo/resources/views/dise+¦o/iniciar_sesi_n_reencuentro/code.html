<!DOCTYPE html>

<html lang="es-VE"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#dae5ff",
                    "on-tertiary-fixed": "#002204",
                    "tertiary-container": "#25752b",
                    "error": "#ba1a1a",
                    "surface": "#f9f9ff",
                    "surface-dim": "#d8dae2",
                    "primary-container": "#1565c0",
                    "on-primary": "#ffffff",
                    "surface-tint": "#005db7",
                    "tertiary-fixed": "#a3f69c",
                    "inverse-primary": "#a9c7ff",
                    "on-primary-fixed": "#001b3d",
                    "primary-fixed": "#d6e3ff",
                    "inverse-on-surface": "#eff0f9",
                    "secondary-fixed-dim": "#afcbd8",
                    "on-secondary-fixed": "#021f29",
                    "secondary-fixed": "#cbe7f5",
                    "surface-container-low": "#f2f3fb",
                    "surface-container-high": "#e7e8f0",
                    "surface-container-highest": "#e1e2ea",
                    "error-container": "#ffdad6",
                    "secondary-container": "#cbe7f5",
                    "on-secondary-fixed-variant": "#304a55",
                    "outline": "#727783",
                    "outline-variant": "#c2c6d4",
                    "surface-variant": "#e1e2ea",
                    "on-primary-fixed-variant": "#00468c",
                    "on-secondary-container": "#4e6874",
                    "on-surface-variant": "#424752",
                    "on-background": "#191c21",
                    "inverse-surface": "#2e3037",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#004d99",
                    "tertiary": "#005c15",
                    "tertiary-fixed-dim": "#88d982",
                    "background": "#f9f9ff",
                    "on-tertiary-container": "#a5f99e",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f9f9ff",
                    "secondary": "#48626e",
                    "on-surface": "#191c21",
                    "surface-container": "#ecedf6",
                    "on-tertiary-fixed-variant": "#005312",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#a9c7ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "margin-desktop": "64px",
                    "xl": "32px",
                    "gutter": "16px",
                    "margin-mobile": "16px",
                    "sm": "8px",
                    "lg": "24px",
                    "base": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Roboto Flex"],
                    "label-md": ["Roboto Flex"],
                    "title-lg": ["Roboto Flex"],
                    "body-lg": ["Roboto Flex"],
                    "label-lg": ["Roboto Flex"],
                    "body-md": ["Roboto Flex"],
                    "display-lg": ["Roboto Flex"],
                    "headline-lg": ["Roboto Flex"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #F5F7FA;
            font-family: 'Roboto Flex', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-0">
<!-- Login Container -->
<main class="login-card bg-surface-container-lowest rounded-xl shadow-md p-lg md:p-xl animate-fade-in">
<!-- Identity Section -->
<div class="flex flex-col items-center mb-xl">
<div class="flex items-center gap-xs mb-md">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="volunteer_activism">volunteer_activism</span>
<span class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">Reencuentro</span>
</div>
<h1 class="font-title-lg text-title-lg text-on-surface text-center">Iniciar sesión</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">Gestión de Reunificación Familiar</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-xs" for="email">Correo electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-md py-3 rounded-xl border border-outline-variant bg-transparent font-body-md text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" name="email" placeholder="ejemplo@organizacion.ve" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-xs" for="password">Contraseña</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-3 rounded-xl border border-outline-variant bg-transparent font-body-md text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant transition-colors cursor-pointer active:scale-95" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-xs">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-3 rounded-full shadow-sm hover:shadow-md active:opacity-80 transition-all flex justify-center items-center gap-sm" type="submit">
<span>INICIAR SESIÓN</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-xl">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-md font-label-md text-label-md text-outline">o</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Footer Link -->
<div class="text-center">
<a class="inline-block font-label-lg text-label-lg text-primary hover:bg-surface-container-high px-md py-sm rounded-lg transition-colors" href="#">
                ¿No tienes cuenta? Registra tu centro en Reencuentro
            </a>
</div>
</main>
<!-- Background Decoration (Subtle) -->
<div class="fixed -bottom-24 -left-24 w-64 h-64 bg-primary-fixed opacity-10 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-96 h-96 bg-tertiary-fixed opacity-10 rounded-full blur-3xl pointer-events-none"></div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Lightweight atmospheric interaction: Ripple effect on button (optional/simplified)
        document.querySelector('button[type="submit"]').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            btn.classList.add('scale-[0.98]');
            setTimeout(() => btn.classList.remove('scale-[0.98]'), 150);
        });
    </script>
</body></html>
